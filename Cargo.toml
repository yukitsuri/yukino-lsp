[package]
name = "yukino-lsp"
version = "0.1.1"
edition = "2021"
authors = ["Yukitsuri <shareui@proton.me>"]
license = "MIT"
description = "Official Language Server Protocol (LSP) for the Yukino programming language."
repository = "https://github.com/yukitsuri/yukino-lsp"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tower-lsp = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Yukino compiler crates
yukic-span = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-span" }
yukic-diagnostics = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-diagnostics" }
yukic-lexer = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-lexer" }
yukic-ast = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-ast" }
yukic-parser = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-parser" }
yukic-resolve = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-resolve" }
yukic-target = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-target" }
yukic-cheader = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukic-cheader" }
yukino-builtin = { git = "https://github.com/yukitsuri/yukino", tag = "v0.1.1", package = "yukino-builtin" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
