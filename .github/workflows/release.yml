name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_key: linux-gnu-x86_64
            asset: yukino-lsp-linux-gnu-x86_64
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            target_key: linux-musl-x86_64
            asset: yukino-lsp-linux-musl-x86_64
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            target_key: linux-gnu-aarch64
            asset: yukino-lsp-linux-gnu-aarch64
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            target_key: linux-musl-aarch64
            asset: yukino-lsp-linux-musl-aarch64
            use_cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_key: windows-msvc-x86_64
            asset: yukino-lsp-windows-msvc-x86_64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cargo/bin
          gh release download -R cross-rs/cross --pattern "cross-x86_64-unknown-linux-musl.tar.gz" -O - | tar -xz -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/cross

      - name: Build release binary (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin yukino-lsp
          else
            cargo build --release --target ${{ matrix.target }} --bin yukino-lsp
          fi

      - name: Prepare assets and checksums (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          cp target/${{ matrix.target }}/release/yukino-lsp ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} | awk '{print $1}' > ${{ matrix.asset }}.sha256
          wc -c < ${{ matrix.asset }} | tr -d ' ' > ${{ matrix.asset }}.size

      - name: Build release binary (Windows)
        if: contains(matrix.target, 'windows')
        run: |
          cargo build --release --target ${{ matrix.target }} --bin yukino-lsp

      - name: Prepare assets and checksums (Windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/yukino-lsp.exe -Destination ${{ matrix.asset }}
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.asset }}).Hash.ToLower()
          Set-Content -Path "${{ matrix.asset }}.sha256" -Value $hash -NoNewline
          $size = (Get-Item ${{ matrix.asset }}).Length
          Set-Content -Path "${{ matrix.asset }}.size" -Value $size -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            ${{ matrix.asset }}.size
          retention-days: 1

  publish:
    name: Publish Release Assets & lacie.toml
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Determine release tag, version and version_number
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          NUM=$(git tag --sort=creatordate | grep -nx "${TAG}" | cut -d: -f1)
          if [ -z "$NUM" ] || [ "$NUM" -le 0 ]; then
            NUM=$(git tag -l | wc -l)
          fi
          if [ -z "$NUM" ] || [ "$NUM" -le 0 ]; then
            NUM=1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_number=${NUM}" >> "$GITHUB_OUTPUT"

      - name: Generate lacie.toml
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          VERSION_NUMBER="${{ steps.ver.outputs.version_number }}"

          SHA_LINUX_GNU_X86_64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-gnu-x86_64.sha256)
          SHA_LINUX_MUSL_X86_64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-musl-x86_64.sha256)
          SHA_LINUX_GNU_AARCH64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-gnu-aarch64.sha256)
          SHA_LINUX_MUSL_AARCH64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-musl-aarch64.sha256)
          SHA_WINDOWS_MSVC_X86_64=$(tr -d ' \r\n' < artifacts/yukino-lsp-windows-msvc-x86_64.exe.sha256)

          SIZE_LINUX_GNU_X86_64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-gnu-x86_64.size)
          SIZE_LINUX_MUSL_X86_64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-musl-x86_64.size)
          SIZE_LINUX_GNU_AARCH64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-gnu-aarch64.size)
          SIZE_LINUX_MUSL_AARCH64=$(tr -d ' \r\n' < artifacts/yukino-lsp-linux-musl-aarch64.size)
          SIZE_WINDOWS_MSVC_X86_64=$(tr -d ' \r\n' < artifacts/yukino-lsp-windows-msvc-x86_64.exe.size)

          cat << EOF > artifacts/lacie.toml
          [workspace]
          author = "shareui <shareui@proton.me>"
          version = "${VERSION}"
          version_number = ${VERSION_NUMBER}
          source_code = "https://github.com/yukitsuri/yukino-lsp"
          links = ["https://github.com/yukitsuri/yukino-lsp"]

          [packages."de.shareui.yukinolsp"]
          name = "yukino-lsp"

          [packages."de.shareui.yukinolsp".binaries."linux-gnu-x86_64"]
          file = "yukino-lsp-linux-gnu-x86_64"
          size = ${SIZE_LINUX_GNU_X86_64}
          sha256 = "${SHA_LINUX_GNU_X86_64}"

          [packages."de.shareui.yukinolsp".binaries."linux-musl-x86_64"]
          file = "yukino-lsp-linux-musl-x86_64"
          size = ${SIZE_LINUX_MUSL_X86_64}
          static = true
          sha256 = "${SHA_LINUX_MUSL_X86_64}"

          [packages."de.shareui.yukinolsp".binaries."linux-gnu-aarch64"]
          file = "yukino-lsp-linux-gnu-aarch64"
          size = ${SIZE_LINUX_GNU_AARCH64}
          sha256 = "${SHA_LINUX_GNU_AARCH64}"

          [packages."de.shareui.yukinolsp".binaries."linux-musl-aarch64"]
          file = "yukino-lsp-linux-musl-aarch64"
          size = ${SIZE_LINUX_MUSL_AARCH64}
          static = true
          sha256 = "${SHA_LINUX_MUSL_AARCH64}"

          [packages."de.shareui.yukinolsp".binaries."windows-msvc-x86_64"]
          file = "yukino-lsp-windows-msvc-x86_64.exe"
          size = ${SIZE_WINDOWS_MSVC_X86_64}
          sha256 = "${SHA_WINDOWS_MSVC_X86_64}"
          EOF

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/yukino-lsp-linux-gnu-x86_64
            artifacts/yukino-lsp-linux-musl-x86_64
            artifacts/yukino-lsp-linux-gnu-aarch64
            artifacts/yukino-lsp-linux-musl-aarch64
            artifacts/yukino-lsp-windows-msvc-x86_64.exe
            artifacts/lacie.toml
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
